*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{width:100%;min-height:100vh;background:#3a2924;color:#f4e8d8;font-family:"Cairo",sans-serif;overflow-x:hidden;transition:background .5s ease,color .5s ease}.page{width:100%;max-width:430px;min-height:100vh;margin:auto;padding:24px 18px 35px;background:#3a2924;transition:background .5s ease}.theme{position:fixed;top:18px;left:18px;width:38px;height:38px;border:none;border-radius:50%;background:#8f624c;color:#f5eadb;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:100;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:scale(.5) rotate(-30deg);animation:themeIn .7s cubic-bezier(.22,1,.36,1) .1s forwards;transition:transform .25s ease,background .3s ease}.theme:hover{transform:rotate(15deg) scale(1.08)}
.profile{position:relative;display:flex;justify-content:center;margin-top:43px;opacity:0;transform:translateY(50px) scale(.75);animation:profileIn 1s cubic-bezier(.16,1,.3,1) .35s forwards}.profile-message{position:absolute;top:247px;left:50%;width:max-content;display:flex;align-items:center;justify-content:center;direction:rtl;color:#f5eadb;font-size:16px;font-weight:600;white-space:nowrap;z-index:1;pointer-events:none;opacity:0;transform:translateX(-50%) translateY(-12px) scale(.75);animation:welcomePulse 3.4s ease-in-out 1.9s infinite}.profile-message b{font-size:23px;font-weight:400;margin-right:7px;line-height:1}.profile-ring{width:235px;height:235px;padding:3px;border-radius:50%;background:linear-gradient(145deg,#f2c18e 0%,#d4773c 38%,#9d4f27 72%,#f0bd83 100%);border:2px solid rgba(246,224,198,.72);position:relative;z-index:3;box-shadow:0 0 0 4px rgba(212,119,60,.16),0 10px 35px rgba(215,122,60,.20),inset 0 0 0 1px rgba(255,255,255,.28);animation:imagePulse 3.4s ease-in-out 1.9s infinite}.profile-image{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#c78d60;border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 0 0 2px rgba(41,32,30,.10)}.profile-image img{width:100%;height:100%;display:block;object-fit:cover;object-position:center center;transform:scale(1.14) translateY(8px);clip-path:circle(50% at 50% 50%);-webkit-clip-path:circle(50% at 50% 50%);animation:imageZoomFull 1.2s cubic-bezier(.16,1,.3,1) .35s both}.description{position:relative;z-index:4;text-align:center;margin-top:58px;font-size:13px;line-height:1.65;font-weight:500;opacity:0;transform:translateY(30px);animation:descriptionIn .9s cubic-bezier(.22,1,.36,1) 1.55s forwards}.name-section{text-align:center;margin-top:39px;opacity:0;transform:translateY(35px) scale(.96);animation:nameIn .9s cubic-bezier(.22,1,.36,1) 2.05s forwards}.name{direction:ltr;font-family:"Playfair Display",serif;line-height:.82;font-size:54px;letter-spacing:-2px}.name-first{display:block;color:#eee7da;overflow:hidden}.name-last{display:block;color:#d4773c;overflow:hidden}.leaf{color:#d4773c;font-family:Georgia,serif;font-size:21px;position:relative;top:-14px;margin-left:3px}.job{direction:ltr;margin-top:17px;font-size:8px;letter-spacing:4px;color:#ddd4c7;opacity:0;animation:jobIn .7s ease 2.65s forwards}.orange-line{width:59px;height:3px;background:#d4773c;margin:10px auto 27px;border-radius:5px;transform:scaleX(0);transform-origin:center;animation:lineIn .7s cubic-bezier(.22,1,.36,1) 2.9s forwards}
.features{width:fit-content;margin:0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:25px;padding:0}.feature{width:100%;display:flex;align-items:center;gap:20px;direction:ltr;opacity:0;transform:translateX(45px) scale(.94);animation:featureIn .7s cubic-bezier(.22,1,.36,1) forwards}.feature:nth-child(1){animation-delay:3.25s}.feature:nth-child(2){animation-delay:3.42s}.feature:nth-child(3){animation-delay:3.59s}.feature:nth-child(4){animation-delay:3.76s}.feature-icon{width:60px;height:60px;min-width:60px;border-radius:50%;background:#c99b72;color:#302521;display:flex;align-items:center;justify-content:center;font-size:25px;border:0;box-shadow:none;transition:transform .3s ease,box-shadow .3s ease}.feature:hover .feature-icon{transform:scale(1.06) rotate(-4deg);box-shadow:0 5px 15px rgba(201,155,114,.18)}.feature-text{direction:rtl;white-space:nowrap;font-size:17px;color:#eee5d8;font-weight:500}
